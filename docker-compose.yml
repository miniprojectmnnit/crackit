version: "3.9"

services:
  # ── Redis ──────────────────────────────────────────────────────────────────
  # Shared state store for WebSocket sessions and rate limit counters.
  # Both Node servers below connect to this single Redis instance.
  redis:
    image: redis:7-alpine
    container_name: crackit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"         # Expose for local debugging (e.g., RedisInsight)
    volumes:
      - redis_data:/data    # Persist Redis data between restarts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node Server 1 ──────────────────────────────────────────────────────────
  crackit-server-1:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: crackit-server-1
    restart: unless-stopped
    env_file:
      - ./server/.env          # Your real .env file (contains all secrets)
    environment:
      # Override REDIS_URI so it points to the Docker redis service (not localhost)
      # Docker internal DNS resolves "redis" to the Redis container above
      REDIS_URI: redis://redis:6379
      PORT: 5000
    depends_on:
      redis:
        condition: service_healthy
    # NOTE: No ports exposed externally — NGINX is the only entry point
    expose:
      - "5000"

  # ── Node Server 2 ──────────────────────────────────────────────────────────
  # Second replica of the same image. Together with Server 1, NGINX load
  # balances traffic between them to simulate the AWS ECS multi-container setup.
  crackit-server-2:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: crackit-server-2
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      REDIS_URI: redis://redis:6379
      PORT: 5000
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "5000"

  # ── NGINX Load Balancer ───────────────────────────────────────────────────
  # Acts as the local equivalent of AWS ALB.
  # Distributes incoming traffic between Server 1 and Server 2.
  nginx:
    image: nginx:alpine
    container_name: crackit-nginx
    restart: unless-stopped
    ports:
      - "80:80"              # All browser requests hit port 80 → NGINX → Node servers
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # Mount our config as read-only
    depends_on:
      - crackit-server-1
      - crackit-server-2

volumes:
  redis_data:
