worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # ── Upstream Pool ──────────────────────────────────────────────────────────
  # Define the pool of Node.js backend containers.
  # In docker-compose, "crackit-server" is the service name; Docker DNS resolves it.
  # In AWS ECS, this block is replaced entirely by the ALB — you don't need this file.
  upstream crackit_backend {
    # Default: Round Robin (each request goes to the next server in order)
    # Uncomment below for Sticky Sessions (use this if you remove Redis Pub/Sub):
    # ip_hash;

    server crackit-server-1:5000;
    server crackit-server-2:5000;
  }

  server {
    listen 80;

    # ── WebSocket Upgrade Headers ────────────────────────────────────────────
    # These two headers are CRITICAL. Without them, NGINX closes the connection
    # after the first HTTP response. With them, it keeps the TCP tunnel open
    # for the live interview WebSocket stream.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    # ── Real IP Passthrough ──────────────────────────────────────────────────
    # Without this, Node.js sees req.ip = NGINX's IP (172.x.x.x) for EVERY user.
    # The rate limiter would then block ALL users at once. This header passes
    # the actual user IP through so rate limiting works per user correctly.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;

    # ── Timeout Settings for Long-Lived WebSockets ───────────────────────────
    # Default NGINX timeout is 60s. An interview can last 30+ minutes.
    # Set to 1 hour to prevent NGINX from dropping the interview connection.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
      proxy_pass http://crackit_backend;
    }
  }
}
